<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#123b65"><title>منظومة مدرسة الدلنجات الصناعية بنات</title>
  <link rel="stylesheet" href="styles.css?v=09353b5">
</head>
<body>
  <header class="topbar"><div><div class="eyebrow">مديرية التربية والتعليم بالبحيرة</div><h1>مدرسة الدلنجات الصناعية بنات</h1><p>منظومة الإدارة المدرسية وقاعدة البيانات</p></div><button id="logoutBtn" class="secondary hidden">تسجيل الخروج</button></header>
  <main class="container">
    <section id="loginView" class="panel login-panel"><h2>تسجيل الدخول</h2><p>استخدم حساب المدرسة المعتمد في Supabase.</p><form id="loginForm"><label>البريد الإلكتروني<input id="loginEmail" type="email" autocomplete="username" required></label><label>كلمة المرور<input id="loginPassword" type="password" autocomplete="current-password" required></label><button type="submit">دخول</button><div id="loginMsg" class="message" aria-live="polite"></div></form></section>
    <section id="appView" class="hidden">
      <div class="welcome panel"><div><h2 id="welcomeTitle">لوحة التحكم</h2><p id="roleLabel"></p></div><div class="stats" id="stats"></div></div>
      <nav id="tabs" class="tabs" aria-label="أقسام المنظومة"></nav>
      <section class="panel"><div class="section-head"><div><h2 id="sectionTitle">العاملون</h2><p id="sectionDesc"></p></div><button id="refreshBtn" class="secondary">تحديث البيانات</button></div><div id="formHost"></div><div id="sectionMsg" class="message" aria-live="polite"></div><div class="table-wrap"><table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table></div></section>
    </section>
    <footer>نسخة تشغيل قابلة للتخصيص — لا تضع مفاتيح سرية داخل ملفات الموقع العامة.</footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script><script src="app.js?v=4a75a21c"></script>
</body></html>
